id: bill_certificate
name: Bill Certificate (Form BC-R)
description: Bill certificate for vendor payments, Form BC-R format
stage: post_event
triggers: [bill certificate, form bc-r, vendor payment, purchase, invoice]
letterhead: svnit
numbering: null
depends_on: [approval_note]
repeat_per: bills
fields:
  - key: event_name
    type: text
    importance: essential
    required: true
  - key: bill_items
    type: table
    importance: essential
    required: true
    ask: "Items purchased (name, qty, unit cost)?"
  - key: supplier_name
    type: text
    importance: essential
    required: true
    ask: "Supplier/vendor name (M/s)?"
  - key: invoice_no
    type: text
    importance: essential
    required: true
    ask: "Invoice number?"
  - key: invoice_date
    type: date
    importance: essential
    required: true
    ask: "Invoice date?"
  - key: tax_type
    type: text
    importance: optional
    required: false
    ask: "Tax type (GST, etc.)?"
  - key: tax_amount
    type: money
    importance: essential
    required: true
    ask: "Tax amount?"
  - key: ref_no
    type: text
    importance: optional
    required: false
    ask: "Bill number?"
  - key: document_date
    type: date
    importance: optional
    required: false
    ask: "Bill date?"
  - key: approval_note_no
    type: text
    importance: optional
    required: false
    ask: "Approval Note number (from the approved Approval Note)?"
  - key: approval_note_date
    type: date
    importance: optional
    required: false
    ask: "Approval Note date?"
  - key: bill_amount
    type: money
    importance: optional
    required: false
    ask: "Bill amount?"
  - key: supplier_gst
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Supplier GST number?"
    defer_ok: true
  - key: purchase_order
    type: text
    importance: optional
    required: false
    ask: "Purchase Order No. and date?"
    default_from: "config.defaults.purchase_order"
    defer_ok: true
  - key: advance
    type: text
    importance: optional
    required: false
    ask: "Advance drawn in Rs. (if any)?"
    default_from: "config.defaults.advance"
    defer_ok: true
  - key: laboratory_office
    type: text
    importance: optional
    required: false
    ask: "Name of the Laboratory / Office?"
    default_from: "config.defaults.laboratory_office"
    defer_ok: true
  - key: certifier_name
    type: text
    importance: optional
    required: false
    defer_ok: true
    ask: "Name of the certifying person ('I, am ____')?"
  - key: payment_party
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Payment party name?"
    defer_ok: true
  - key: payment_account_no
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Payment account number?"
    defer_ok: true
  - key: payment_holder
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Account holder name?"
    defer_ok: true
  - key: payment_bank
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Bank name?"
    defer_ok: true
  - key: payment_branch
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Bank branch?"
    defer_ok: true
  - key: payment_ifsc
    type: text
    importance: optional
    required: false
    mask: true
    ask: "IFSC code?"
    defer_ok: true
sections: []
