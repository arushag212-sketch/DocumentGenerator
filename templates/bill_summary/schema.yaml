id: bill_summary
name: Bill Summary
description: Reimbursement summary for costs incurred in an event
stage: post_event
triggers: [reimbursement, bill summary, payment summary, cost, expenses]
letterhead: acm
numbering: null
depends_on: []
repeat_per: null
fields:
  - key: event_name
    type: text
    importance: essential
    required: true
    ask: "What event is this reimbursement for?"
  - key: other_reimbursements
    type: table
    importance: essential
    required: false
    ask: "Other payees and amounts?"
  - key: winners
    type: table
    importance: optional
    required: false
    ask: "Winners and prize amounts?"
  - key: document_date
    type: date
    importance: optional
    required: false
    ask: "Date for the bill summary?"
sections: []
