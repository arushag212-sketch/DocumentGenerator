id: bill_summary
name: Bill Summary
description: Reimbursement summary for costs incurred in an event
stage: post_event
triggers: [reimbursement, bill summary, payment summary, cost, expenses]
recommend:
  keywords: [bill summary, expense summary, expenditure summary]
  auto_when: [bills]
  requires: [bills, bundle]
  reason: "Consolidated summary of the event's bills and expenses."
  reason_not: "Needed after the event, when bills are settled."
letterhead: acm
numbering: null
depends_on: []
repeat_per: null
fields:
  - key: event_name
    type: text
    importance: essential
    required: true
    ask: "What event is this reimbursement for?"
  - key: other_reimbursements
    type: table
    importance: essential
    required: false
    ask: "Other payees and amounts?"
  - key: winners
    type: table
    importance: optional
    required: false
    ask: "Winners and prize amounts?"
  - key: document_date
    type: date
    importance: optional
    required: false
    ask: "Date for the bill summary?"
sections: []
