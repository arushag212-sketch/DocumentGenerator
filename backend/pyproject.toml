# Project metadata and test settings. Dependencies are pinned in requirements.txt
# (production) and requirements-dev.txt (tests); install with pip install -r.
[project]
name = "clubdocs"
version = "1.0.0"
description = "SVNIT ClubDocs: official document generator for SVNIT student clubs"
requires-python = ">=3.11"

[project.scripts]
docgen = "docgen.cli:main"

[tool.setuptools.packages.find]
include = ["docgen*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: live tests requiring external API keys",
]
