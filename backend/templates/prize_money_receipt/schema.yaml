id: prize_money_receipt
name: Prize Money Receipt
description: Prize money receipt for individual winners
stage: post_event
triggers: [prize, winner, award, prize money, receipt]
recommend:
  keywords: [prize money receipt, prize receipt]
  auto_when: [winners]
  requires: [winners]
  suppress_when: [certificate]
  reason: "Each winner signs a receipt for the prize money paid."
  reason_not: "Needed after the event, once winners and prize amounts are declared."
letterhead: svnit
numbering:
  series: PRIZE
  format: "{club_code}/{short_year}/{series}/{seq:03d}"
  confirm: false
depends_on: []
repeat_per: winners
fields:
  - key: event_name
    type: text
    importance: essential
    required: true
    ask: "What is the event title?"
  - key: dates
    type: date_range
    importance: essential
    required: true
    ask: "When was the event held?"
  - key: venue
    type: text
    importance: essential
    required: true
    ask: "Where was the event held?"
  - key: winner_name
    type: text
    importance: essential
    required: true
    ask: "Winner's full name?"
  - key: winner_position
    type: text
    importance: essential
    required: true
    ask: "Position (1st, 2nd, 3rd)?"
  - key: winner_amount
    type: money
    importance: essential
    required: true
    ask: "Prize amount in INR?"
  - key: sr_no
    type: int
    importance: optional
    required: false
    computed:
      function: sr_no
      args: {index: "$_repeat_index"}
  - key: document_date
    type: date
    importance: optional
    required: false
    ask: "Date for the receipt?"
  - key: winner_amount_words
    type: text
    importance: optional
    required: false
    computed:
      function: amount_in_words_inr
      args: {amount: "$winner_amount"}
  - key: winner_roll_no
    type: text
    importance: optional
    required: false
    ask: "Winner's roll number?"
    defer_ok: true
  - key: winner_course_semester
    type: text
    importance: optional
    required: false
    ask: "Winner's course and semester?"
    defer_ok: true
  - key: winner_mobile
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Winner's mobile number?"
    defer_ok: true
  - key: winner_bank_name_as_per_bank
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Name as per bank account?"
    defer_ok: true
  - key: winner_bank_name
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Bank name?"
    defer_ok: true
  - key: winner_bank_branch
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Bank branch?"
    defer_ok: true
  - key: winner_account_no
    type: text
    importance: optional
    required: false
    mask: true
    ask: "Bank account number?"
    defer_ok: true
  - key: winner_ifsc
    type: text
    importance: optional
    required: false
    mask: true
    ask: "IFSC code?"
    defer_ok: true
  - key: winner_pan
    type: text
    importance: optional
    required: false
    mask: true
    ask: "PAN number?"
    defer_ok: true
sections: []
