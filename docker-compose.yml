version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clubdocs-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://clubdocs_user:clubdocs_password@postgres:5432/clubdocs
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_ROOT=/app/storage
    volumes:
      - clubdocs_data:/app/data
      - clubdocs_storage:/app/storage
      - clubdocs_outputs:/app/outputs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s

  postgres:
    image: postgres:16-alpine
    container_name: clubdocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubdocs_user
      POSTGRES_PASSWORD: clubdocs_password
      POSTGRES_DB: clubdocs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubdocs_user -d clubdocs"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  clubdocs_data:
  clubdocs_storage:
  clubdocs_outputs:
